<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course - Amr Alsariti Economics</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="container">
            <div class="nav-wrapper">
                <div class="logo">
                    <i class="fas fa-graduation-cap"></i>
                    <span>Amr Alsariti Economics</span>
                </div>
                <ul class="nav-menu">
                    <li><a href="user-dashboard.html">Dashboard</a></li>
                    <li><a href="#" onclick="logout()">Logout</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container" style="padding: 2rem 20px;">
        <!-- Course Header -->
        <div class="card">
            <div id="courseHeader"></div>
        </div>

        <!-- Course Tabs -->
        <div class="card">
            <div style="border-bottom: 2px solid var(--border-color); margin-bottom: 1.5rem;">
                <div style="display: flex; gap: 2rem;">
                    <button class="tab-btn active" onclick="showTab('videos')">
                        <i class="fas fa-video"></i> Video Lectures
                    </button>
                    <button class="tab-btn" onclick="showTab('pdfs')">
                        <i class="fas fa-file-pdf"></i> Study Materials
                    </button>
                    <button class="tab-btn" onclick="showTab('quizzes')">
                        <i class="fas fa-clipboard-check"></i> Quizzes
                    </button>
                    <button class="tab-btn" onclick="showTab('assignments')">
                        <i class="fas fa-tasks"></i> Assignments
                    </button>
                </div>
            </div>

            <!-- Videos Tab -->
            <div id="videosTab" class="tab-content">
                <div id="videosList"></div>
            </div>

            <!-- PDFs Tab -->
            <div id="pdfsTab" class="tab-content" style="display: none;">
                <div id="pdfsList"></div>
            </div>

            <!-- Quizzes Tab -->
            <div id="quizzesTab" class="tab-content" style="display: none;">
                <div id="quizzesList"></div>
            </div>

            <!-- Assignments Tab -->
            <div id="assignmentsTab" class="tab-content" style="display: none;">
                <div id="assignmentsList"></div>
            </div>
        </div>
    </div>

    <!-- Video Player Modal -->
    <div id="videoModal" class="modal">
        <div class="modal-content" style="max-width: 900px;">
            <div class="modal-header">
                <h2 id="videoTitle">Video</h2>
                <span class="modal-close" onclick="closeVideoModal()">&times;</span>
            </div>
            <div class="video-container">
                <iframe id="videoPlayer" frameborder="0" allowfullscreen></iframe>
            </div>
            <div id="videoDescription" style="margin-top: 1rem;"></div>
        </div>
    </div>

    <!-- PDF Viewer Modal -->
    <div id="pdfModal" class="modal">
        <div class="modal-content" style="max-width: 900px;">
            <div class="modal-header">
                <h2 id="pdfTitle">PDF Document</h2>
                <span class="modal-close" onclick="closePDFModal()">&times;</span>
            </div>
            <div class="pdf-container">
                <iframe id="pdfViewer" frameborder="0"></iframe>
            </div>
        </div>
    </div>

    <style>
        .tab-btn {
            padding: 1rem 1.5rem;
            border: none;
            background: none;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 500;
            color: #6b7280;
            border-bottom: 3px solid transparent;
            transition: all 0.3s;
        }

        .tab-btn:hover {
            color: var(--primary-color);
        }

        .tab-btn.active {
            color: var(--primary-color);
            border-bottom-color: var(--primary-color);
        }

        .content-item {
            padding: 1.5rem;
            border: 2px solid var(--border-color);
            border-radius: 10px;
            margin-bottom: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s;
        }

        .content-item:hover {
            border-color: var(--primary-color);
            box-shadow: var(--shadow);
        }

        .content-item-info h3 {
            margin-bottom: 0.5rem;
            color: var(--dark-color);
        }

        .content-item-info p {
            color: #6b7280;
            font-size: 0.9rem;
        }

        .content-item-meta {
            display: flex;
            gap: 1rem;
            margin-top: 0.5rem;
            font-size: 0.875rem;
            color: #6b7280;
        }
    </style>

    <script src="js/database.js"></script>
    <script src="js/auth.js"></script>
    <script>
        // Check authentication
        if (!checkAuth()) {
            window.location.href = 'login.html';
        }

        // Get course ID from URL
        const urlParams = new URLSearchParams(window.location.search);
        const courseId = parseInt(urlParams.get('id'));
        const currentUser = getCurrentUserInfo();

        if (!courseId) {
            alert('Invalid course');
            window.location.href = 'user-dashboard.html';
        }

        const course = DB.getCourseById(courseId);
        if (!course) {
            alert('Course not found');
            window.location.href = 'user-dashboard.html';
        }

        // Load course header
        document.getElementById('courseHeader').innerHTML = `
            <h1 style="margin-bottom: 1rem;">${course.title}</h1>
            <p style="font-size: 1.1rem; color: #6b7280; margin-bottom: 1rem;">${course.description}</p>
            <div style="display: flex; gap: 2rem; flex-wrap: wrap;">
                <div style="display: flex; align-items: center; gap: 0.5rem;">
                    <i class="fas fa-user"></i>
                    <span>${course.instructor}</span>
                </div>
                <div style="display: flex; align-items: center; gap: 0.5rem;">
                    <i class="fas fa-video"></i>
                    <span>${course.lectures} Lectures</span>
                </div>
                <div style="display: flex; align-items: center; gap: 0.5rem;">
                    <i class="fas fa-clock"></i>
                    <span>${course.duration}</span>
                </div>
            </div>
        `;

        function showTab(tab) {
            // Hide all tabs
            document.querySelectorAll('.tab-content').forEach(content => {
                content.style.display = 'none';
            });

            // Remove active class from all buttons
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('active');
            });

            // Show selected tab
            const tabMap = {
                'videos': 'videosTab',
                'pdfs': 'pdfsTab',
                'quizzes': 'quizzesTab',
                'assignments': 'assignmentsTab'
            };

            document.getElementById(tabMap[tab]).style.display = 'block';
            event.target.classList.add('active');

            // Load tab content
            loadTabContent(tab);
        }

        function loadTabContent(tab) {
            switch(tab) {
                case 'videos':
                    loadVideos();
                    break;
                case 'pdfs':
                    loadPDFs();
                    break;
                case 'quizzes':
                    loadQuizzes();
                    break;
                case 'assignments':
                    loadAssignments();
                    break;
            }
        }

        function loadVideos() {
            const videos = DB.getVideosByCourse(courseId);
            const container = document.getElementById('videosList');

            if (videos.length === 0) {
                container.innerHTML = '<p style="text-align: center; color: #6b7280; padding: 2rem;">No videos available for this course</p>';
                return;
            }

            let html = '';
            videos.forEach((video, index) => {
                html += `
                    <div class="content-item">
                        <div class="content-item-info">
                            <h3>Lecture ${index + 1}: ${video.title}</h3>
                            <p>${video.description}</p>
                            <div class="content-item-meta">
                                <span><i class="fas fa-clock"></i> ${video.duration}</span>
                            </div>
                        </div>
                        <button class="btn btn-primary" onclick="playVideo(${video.id})">
                            <i class="fas fa-play"></i> Watch
                        </button>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        function loadPDFs() {
            const pdfs = DB.getPDFsByCourse(courseId);
            const container = document.getElementById('pdfsList');

            if (pdfs.length === 0) {
                container.innerHTML = '<p style="text-align: center; color: #6b7280; padding: 2rem;">No study materials available for this course</p>';
                return;
            }

            let html = '';
            pdfs.forEach(pdf => {
                html += `
                    <div class="content-item">
                        <div class="content-item-info">
                            <h3>${pdf.title}</h3>
                            <p>${pdf.description}</p>
                            <div class="content-item-meta">
                                <span><i class="fas fa-file"></i> ${pdf.pages} pages</span>
                            </div>
                        </div>
                        <div style="display: flex; gap: 0.5rem;">
                            <button class="btn btn-primary" onclick="viewPDF(${pdf.id})">
                                <i class="fas fa-eye"></i> View
                            </button>
                            <a href="${pdf.url}" target="_blank" class="btn btn-secondary">
                                <i class="fas fa-download"></i> Download
                            </a>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        function loadQuizzes() {
            const quizzes = DB.getQuizzesByCourse(courseId);
            const container = document.getElementById('quizzesList');

            if (quizzes.length === 0) {
                container.innerHTML = '<p style="text-align: center; color: #6b7280; padding: 2rem;">No quizzes available for this course</p>';
                return;
            }

            let html = '';
            quizzes.forEach(quiz => {
                html += `
                    <div class="content-item">
                        <div class="content-item-info">
                            <h3>${quiz.title}</h3>
                            <div class="content-item-meta">
                                <span><i class="fas fa-question-circle"></i> ${quiz.questions.length} questions</span>
                                <span><i class="fas fa-clock"></i> ${quiz.duration} minutes</span>
                            </div>
                        </div>
                        <a href="quiz.html?id=${quiz.id}" class="btn btn-primary">
                            <i class="fas fa-clipboard-check"></i> Start Quiz
                        </a>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        function loadAssignments() {
            const assignments = DB.getAssignmentsByCourse(courseId);
            const submissions = DB.getUserSubmissions(currentUser.id);
            const container = document.getElementById('assignmentsList');

            if (assignments.length === 0) {
                container.innerHTML = '<p style="text-align: center; color: #6b7280; padding: 2rem;">No assignments available for this course</p>';
                return;
            }

            let html = '';
            assignments.forEach(assignment => {
                const submission = submissions.find(s => s.assignmentId === assignment.id);
                const dueDate = new Date(assignment.dueDate);
                const isOverdue = dueDate < new Date() && !submission;

                html += `
                    <div class="content-item">
                        <div class="content-item-info">
                            <h3>${assignment.title}</h3>
                            <p>${assignment.description}</p>
                            <div class="content-item-meta">
                                <span><i class="fas fa-calendar"></i> Due: ${dueDate.toLocaleDateString()}</span>
                                <span><i class="fas fa-star"></i> ${assignment.points} points</span>
                                <span>
                                    ${submission ? '<span class="badge badge-success">Submitted</span>' :
                                      (isOverdue ? '<span class="badge badge-danger">Overdue</span>' :
                                      '<span class="badge badge-warning">Pending</span>')}
                                </span>
                            </div>
                        </div>
                        ${submission ?
                          '<button class="btn btn-secondary" disabled><i class="fas fa-check"></i> Submitted</button>' :
                          `<a href="assignment.html?id=${assignment.id}" class="btn btn-primary"><i class="fas fa-upload"></i> Submit</a>`}
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        function playVideo(videoId) {
            const video = DB.getVideos().find(v => v.id === videoId);
            if (video) {
                document.getElementById('videoTitle').textContent = video.title;
                document.getElementById('videoPlayer').src = video.url;
                document.getElementById('videoDescription').innerHTML = `<p>${video.description}</p>`;
                document.getElementById('videoModal').classList.add('active');
            }
        }

        function viewPDF(pdfId) {
            const pdf = DB.getPDFs().find(p => p.id === pdfId);
            if (pdf) {
                document.getElementById('pdfTitle').textContent = pdf.title;
                document.getElementById('pdfViewer').src = pdf.url;
                document.getElementById('pdfModal').classList.add('active');
            }
        }

        function closeVideoModal() {
            document.getElementById('videoModal').classList.remove('active');
            document.getElementById('videoPlayer').src = '';
        }

        function closePDFModal() {
            document.getElementById('pdfModal').classList.remove('active');
            document.getElementById('pdfViewer').src = '';
        }

        // Close modals when clicking outside
        window.addEventListener('click', function(event) {
            if (event.target.classList.contains('modal')) {
                event.target.classList.remove('active');
                document.getElementById('videoPlayer').src = '';
                document.getElementById('pdfViewer').src = '';
            }
        });

        // Initial load
        loadVideos();
    </script>
</body>
</html>
